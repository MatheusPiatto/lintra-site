# Mantém as APIs gratuitas do Render acordadas no horário de uso (o plano grátis dorme após 15 min sem acesso).
# Orçamento: o Render dá 750 horas/mês para o workspace inteiro. Se passar, TODOS os serviços grátis são
# suspensos até o mês seguinte. Por isso:
#   - API do CoachApp: a cada 10 min das 05h às 23h (Brasília) ≈ 18 h/dia ≈ 560 h/mês;
#   - LINTRA Core: um toque por dia ao meio-dia, para rodar a régua de cobrança e reenvios (≈ 0,3 h/dia);
#   - o resto da folga cobre os acessos normais ao Core (cadastros e logins).
# Some ao migrar para o servidor próprio no Google (aí nada dorme e este arquivo pode ser apagado).
name: Manter acordado

on:
  schedule:
    - cron: "*/10 8-23 * * *"   # 05h–20h50 Brasília (UTC-3)
    - cron: "*/10 0-1 * * *"    # 21h–22h50 Brasília
    - cron: "0 15 * * *"        # 12h Brasília: toque diário no Core
  workflow_dispatch:

permissions: {}

jobs:
  tocar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API do CoachApp
        if: github.event.schedule != '0 15 * * *'
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "coach %{http_code} %{time_total}s\n" https://coachapp-api-7xfe.onrender.com/health
      - name: LINTRA Core
        if: github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "core %{http_code} %{time_total}s\n" https://id.lintratech.com.br/health
